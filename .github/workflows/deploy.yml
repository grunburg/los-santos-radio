# Builds the app and publishes it to GitHub Pages on every push to main.
#
# The station files (2.7 GB) stay out of the site, which Pages caps at 1 GB: the build points
# the app at this repository's raw files for the deployed commit instead. Pages must be set to
# deploy from GitHub Actions (Settings → Pages → Source).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the app: the station audio isn't needed to build, and it's most of the repo.
          sparse-checkout: |
            src
            public

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@v5

      - run: pnpm build
        env:
          # "/<repo>" for a project site, "" for a user site.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_STATIONS_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/stations/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
